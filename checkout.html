<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DigiElite — Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#f7fbff;background:radial-gradient(circle at 20% 20%, rgba(199,255,0,0.16), transparent 22%),radial-gradient(circle at 82% 8%, rgba(255,122,0,0.12), transparent 18%),linear-gradient(180deg,#050611 0%,#070a12 100%);}
    .wrap{max-width:920px;margin:28px auto;padding:18px}
    h1{margin:0 0 12px;font-family:'Big Shoulders Display',sans-serif;font-size:3rem;letter-spacing:-0.04em;}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:18px}
    .card{background:rgba(255,255,255,0.04);padding:22px;border-radius:18px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 26px 70px rgba(0,0,0,0.28)}
    label{display:block;margin:10px 0 6px;font-weight:600;color:#e2e8f0}
    input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#f7fbff}
    input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.55)}
    .order-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
    .total{font-weight:800;margin-top:12px;color:#f7fbff}
    .pay-btn{display:inline-block;background:linear-gradient(90deg,var(--primary, #c7ff00),var(--accent, #ff7a00));color:#050611;padding:12px 18px;border-radius:14px;text-decoration:none;margin-top:12px;border:none;cursor:pointer}
    .muted{color:rgba(255,255,255,0.6)}
    h2,h3{margin:0 0 12px;color:#f7fbff}
    body a{color:rgba(255,255,255,0.85);text-decoration:none}
    body a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Checkout</h1>
    <div class="grid">
      <div>
        <div class="card">
          <h2>Contact & Billing</h2>
          <label for="name">Full name</label>
          <input id="name" placeholder="Your name" />

          <label for="phone">Phone</label>
          <input id="phone" placeholder="Mobile number" />

          <label for="email">Email</label>
          <input id="email" placeholder="you@company.com" />

          <label for="address">Address</label>
          <textarea id="address" rows="3" placeholder="Billing address"></textarea>

          <h3 style="margin-top:14px">Payment method</h3>
          <select id="paymentMethod">
            <option value="mock_upi">UPI (Mock)</option>
            <option value="mock_card">Card (Mock)</option>
          </select>

          <div style="margin-top:12px" class="muted">This is a mock payment flow for demo. To integrate a real gateway (Razorpay/Stripe/Paytm), you'll need API keys and server-side support.</div>
        </div>
      </div>

      <aside>
        <div class="card">
          <h2>Order Summary</h2>
          <div id="orderList"></div>
          <div id="emptyMsg" class="muted">Your cart is empty.</div>
          <div id="orderTotal" class="total">Total: ₹0</div>
          <button id="pay" class="pay-btn">Pay Now (Mock)</button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('advigooCart')||'[]');
    const orderList = document.getElementById('orderList');
    const orderTotal = document.getElementById('orderTotal');
    const emptyMsg = document.getElementById('emptyMsg');

    function renderOrder(){
      orderList.innerHTML='';
      if(cart.length===0){emptyMsg.style.display='block';orderTotal.style.display='none';return}
      emptyMsg.style.display='none';orderTotal.style.display='block';
      let total=0;
      cart.forEach(i=>{
        total+=i.price*i.quantity;
        const div=document.createElement('div');
        div.className='order-item';
        const label = i.budget?`${i.name} (${i.budget}/day)`:i.name;
        div.innerHTML=`<div>${label} x ${i.quantity}</div><div>₹${i.price*i.quantity}</div>`;
        orderList.appendChild(div);
      });
      orderTotal.textContent=`Total: ₹${total}`;
    }

    document.getElementById('pay').addEventListener('click',()=>{
      // basic validation
      const name=document.getElementById('name').value.trim();
      const phone=document.getElementById('phone').value.trim();
      const email=document.getElementById('email').value.trim();
      if(!name||!phone){alert('Please enter name and phone');return}

      // Mock payment process
      const method=document.getElementById('paymentMethod').value;
      // simulate payment delay
      document.getElementById('pay').disabled=true;document.getElementById('pay').textContent='Processing...';
      setTimeout(()=>{
        // success
        // send order (in real app, POST to server)
        localStorage.removeItem('advigooCart');
        window.location.href='success.html';
      },1500);
    });

    renderOrder();
  </script>
</body>
</html>
